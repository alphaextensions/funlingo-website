<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FunLingo support notifier</title>
</head>
<body>
<!-- ==========================================================================
  FunLingo · unread-reply notifier (host this on YOUR website)
  --------------------------------------------------------------------------
  WHAT IT DOES
    Runs the Crisp JS SDK, stays invisible, reads Crisp's unread-message count,
    and posts it to the FunLingo extension popup so it can light the red dot
    when your support team replies. (Crisp's own hosted chatbox posts nothing to
    the parent, so this tiny page is the only client-side way to know.)

  HOW TO USE
    1. Upload this file to your site, e.g.  https://getfunlingo.com/crisp-embed.html
    2. In the extension's  popup/funlingo-support.js  set:
           reporterUrl: "https://getfunlingo.com/crisp-embed.html"
    3. Reload the extension. The popup loads this page hidden; when support
       replies, the Chat Support card shows a red dot.

  It receives website_id and token_id via the URL (added by the extension) so it
  binds to the SAME Crisp visitor/conversation as the in-popup chat.
=========================================================================== -->
<script>
(function () {
  "use strict";
  function qp(k) {
    try { return new URLSearchParams(location.search).get(k) || ""; } catch (e) { return ""; }
  }
  var websiteId = qp("website_id");
  var tokenId = qp("token_id");
  if (!websiteId) return;

  window.$crisp = [];
  window.CRISP_WEBSITE_ID = websiteId;
  if (tokenId) window.CRISP_TOKEN_ID = tokenId; // same visitor as the popup chat

  // keep the chatbox + launcher hidden — this page is only a silent reporter
  window.$crisp.push(["do", "chat:hide"]);
  window.$crisp.push(["safe", true]);

  function report() {
    var c = 0;
    try { c = window.$crisp.get("chat:unread:count") || 0; } catch (e) {}
    try { parent.postMessage({ type: "flcs:unread", count: Number(c) || 0 }, "*"); } catch (e) {}
  }
  window.$crisp.push(["on", "session:loaded", report]);
  window.$crisp.push(["on", "message:received", report]);
  window.$crisp.push(["on", "message:sent", report]);
  window.$crisp.push(["on", "chat:opened", report]);
  window.$crisp.push(["on", "chat:closed", report]);

  // load the SDK
  var d = document, s = d.createElement("script");
  s.src = "https://client.crisp.chat/l.js"; s.async = 1;
  (d.head || d.documentElement).appendChild(s);

  // safety-net poll (also reconciles read-state changed by the other session)
  setInterval(report, 4000);
  // and an initial nudge in case events fire before our listeners attach
  setTimeout(report, 1500);
})();
</script>
</body>
</html>
